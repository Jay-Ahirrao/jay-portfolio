<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/jlogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
    <title>Portfolio - Jay Ahirrao</title>
    <style>
      /* Prevent scrolling while loading */
      body.loading-active {
        overflow: hidden !important;
        height: 100vh !important;
      }
    </style>
  </head>
  <body class="loading-active">
    <!-- Loading Screen Overlay -->
    <div id="loader-wrapper" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #000000; display: flex; justify-content: center; align-items: center; z-index: 999999; transition: opacity 0.5s ease-out, visibility 0.5s ease-out; opacity: 1; visibility: visible;">
      <div style="text-align: center;">
        <img src="/loading.gif" alt="Loading..." style="width: 240px; height: auto; display: block; margin: 0 auto; user-select: none; -webkit-user-select: none;" />
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function() {
        var loader = document.getElementById('loader-wrapper');
        function hideLoader() {
          document.body.classList.remove('loading-active');
          if (loader && loader.style.opacity !== '0') {
            loader.style.opacity = '0';
            loader.style.visibility = 'hidden';
            setTimeout(function() {
              if (loader && loader.parentNode) {
                loader.parentNode.removeChild(loader);
              }
            }, 500);
          }
        }
        if (document.readyState === 'complete') {
          hideLoader();
        } else {
          window.addEventListener('load', hideLoader);
          // Fallback: hide loader after 6 seconds anyway to ensure usability
          setTimeout(hideLoader, 6000);
        }
      })();
    </script>
  </body>
</html>
